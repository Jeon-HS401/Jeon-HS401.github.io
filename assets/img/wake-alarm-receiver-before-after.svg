<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 348" width="100%" role="img"
     font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif">
  <title>발화 경로 전/후 도식</title>

  <defs>
    <marker id="wa-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#687179"/>
    </marker>
    <marker id="wa-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a5320"/>
    </marker>
    <marker id="wa-cool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#285f76"/>
    </marker>
  </defs>

  <!-- ==================== 배경 밴드 (가장 먼저) ==================== -->
  <rect x="12" y="12"  width="596" height="140" rx="10" fill="#f5f2ee"/>
  <rect x="12" y="164" width="596" height="140" rx="10" fill="#edf5f1"/>

  <!-- ==================== (전) 연결선 — 박스보다 먼저 ==================== -->
  <!-- 예약 → 브로드캐스트: 실선(이어진 구간) -->
  <line x1="150" y1="99" x2="168" y2="99" stroke="#687179" stroke-width="1.8" marker-end="url(#wa-gray)"/>
  <!-- 브로드캐스트 → 받을 리시버 없음 → 알림 0: 점선(끊긴 구간) -->
  <line x1="298" y1="99" x2="316" y2="99" stroke="#8a5320" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#wa-warm)"/>
  <line x1="446" y1="99" x2="464" y2="99" stroke="#8a5320" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#wa-warm)"/>

  <!-- ==================== (전) 박스 ==================== -->
  <rect x="24"  y="62" width="124" height="74" rx="6" fill="#ffffff" stroke="#bcc4c9" stroke-width="1.4"/>
  <rect x="172" y="62" width="124" height="74" rx="6" fill="#ffffff" stroke="#bcc4c9" stroke-width="1.4"/>
  <!-- 받을 리시버 없음 — 채움 없이 점선 테두리(다른 박스는 흰 채움 + 실선) -->
  <rect x="320" y="62" width="124" height="74" rx="6" fill="none" stroke="#8a5320" stroke-width="1.6" stroke-dasharray="6 4"/>
  <!-- 알림 0 — 점선 테두리 -->
  <rect x="468" y="62" width="124" height="74" rx="6" fill="#ffffff" stroke="#8a5320" stroke-width="1.6" stroke-dasharray="6 4"/>

  <!-- ==================== (전) 텍스트 — 가장 나중 ==================== -->
  <text x="24" y="44" font-size="20" font-weight="700" fill="#202428">(전) 발화 경로</text>

  <text x="86"  y="106" text-anchor="middle" font-size="18" fill="#202428">예약</text>
  <text x="234" y="106" text-anchor="middle" font-size="18" fill="#202428">브로드캐스트</text>
  <text x="382" y="95"  text-anchor="middle" font-size="18" fill="#8a5320">받을 리시버</text>
  <text x="382" y="118" text-anchor="middle" font-size="18" fill="#8a5320">없음</text>
  <text x="530" y="106" text-anchor="middle" font-size="18" fill="#8a5320">알림 0</text>

  <!-- ==================== (후) 연결선 ==================== -->
  <line x1="150" y1="251" x2="168" y2="251" stroke="#687179" stroke-width="1.8" marker-end="url(#wa-gray)"/>
  <line x1="298" y1="251" x2="316" y2="251" stroke="#285f76" stroke-width="1.8" marker-end="url(#wa-cool)"/>
  <line x1="446" y1="251" x2="464" y2="251" stroke="#285f76" stroke-width="1.8" marker-end="url(#wa-cool)"/>

  <!-- ==================== (후) 박스 ==================== -->
  <rect x="24"  y="214" width="124" height="74" rx="6" fill="#ffffff" stroke="#bcc4c9" stroke-width="1.4"/>
  <rect x="172" y="214" width="124" height="74" rx="6" fill="#ffffff" stroke="#bcc4c9" stroke-width="1.4"/>
  <!-- 선언된 리시버 — 이중 테두리로 (전)의 빈자리와 구분 -->
  <rect x="320" y="214" width="124" height="74" rx="7" fill="#ffffff" stroke="#285f76" stroke-width="2"/>
  <rect x="325" y="219" width="114" height="64" rx="4" fill="none" stroke="#285f76" stroke-width="1"/>
  <rect x="468" y="214" width="124" height="74" rx="6" fill="#ffffff" stroke="#285f76" stroke-width="1.6"/>

  <!-- ==================== (후) 텍스트 ==================== -->
  <text x="24" y="196" font-size="20" font-weight="700" fill="#202428">(후) 발화 경로</text>

  <text x="86"  y="258" text-anchor="middle" font-size="18" fill="#202428">예약</text>
  <text x="234" y="258" text-anchor="middle" font-size="18" fill="#202428">브로드캐스트</text>
  <text x="382" y="247" text-anchor="middle" font-size="18" fill="#285f76">선언된</text>
  <text x="382" y="270" text-anchor="middle" font-size="18" fill="#285f76">리시버</text>
  <text x="530" y="258" text-anchor="middle" font-size="18" fill="#285f76">알림</text>

  <!-- ==================== 범례 ==================== -->
  <line x1="176" y1="328" x2="210" y2="328" stroke="#687179" stroke-width="2"/>
  <text x="218" y="333" font-size="15" fill="#687179">이어진 구간</text>
  <line x1="326" y1="328" x2="360" y2="328" stroke="#8a5320" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="368" y="333" font-size="15" fill="#687179">끊긴 구간</text>
</svg>
