<!doctype html>
<html lang="{{ site.lang | default: 'ko-KR' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <div class="reading-progress" id="reading-progress" aria-hidden="true"></div>

  {% include site-header.html %}

  <main id="main">
    {{ content }}
  </main>

  {% include site-footer.html %}

  <script>
    (() => {
      const progress = document.getElementById("reading-progress");
      const article = document.querySelector("article");
      if (!progress || !article) return;

      function update() {
        const start = article.offsetTop;
        const available = Math.max(1, article.offsetHeight - window.innerHeight);
        const value = Math.min(1, Math.max(0, (window.scrollY - start) / available));
        progress.style.width = `${value * 100}%`;
        progress.classList.add("is-visible");
      }
      window.addEventListener("scroll", update, { passive: true });
      window.addEventListener("resize", update);
      update();
    })();
  </script>
</body>
</html>
