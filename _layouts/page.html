layout: default
---
<div class="page-body">
  <header class="page-head">
    {% if page.label %}<p class="label"><span class="k">{{ page.label }}</span></p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}
  </header>

  {{ content }}
</div>
