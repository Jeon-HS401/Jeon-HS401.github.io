# 블로그 설정
# title은 임시("작업실 기록") — 공개 전 CD 확정 (DESIGN.md §4)
title: "작업실 기록"
description: "기술 설명, 프로젝트의 선택과 실패, 다음 작업을 실제 코드와 실행 결과 가까이에 기록하는 개인 개발 블로그."
lang: ko-KR
author: "Jeon"

theme: minima
plugins:
  - jekyll-feed

# 왼쪽 사이트 레일
tagline: "코드보다 판단이 먼저 보이는 기록."

# 무대 첫 줄
intro: "기술을 설명하고, 프로젝트를 진행하며 바뀐 선택을 남깁니다. 실행 결과가 있으면 보여주고, 근거가 없으면 억지로 이야기를 만들지 않습니다."

# 레일 NOW 블록
now_title: "content-agent 드래프터 파이프라인"
now_body: "활동에서 근거를 모아, 근거가 있는 초안만 블로그 PR로 보내는 개인 드래프터를 만들고 있습니다."
now_next: "실제 글로 발행 흐름 검증"

# 레일 TOPICS 블록
topics: "automation · developer tools<br>writing systems · SQL"

editorial_principle: "결과만 진열하지 않고, 무엇을 선택했고 어디에서 막혔는지를 근거 가까이에 둔다."
github_url: "https://github.com/Jeon-HS401"

# 2026-09-03 권장안 A 전환으로 쓰이지 않게 된 키 (문구는 위로 옮겼다):
#   hero_eyebrow "DEVELOPER WORKLOG · SEOUL" — 히어로가 없어졌다
#   hero_title   → tagline
#   hero_lead    → intro
#   header_status "content-agent · designing" — 상태 배지 제거(DESIGN §7)
#   current_project / current_project_note — 레일 NOW와 중복
#   about_heading — /about/ 페이지가 자기 문구를 갖는다

# 사이트에 싣지 않을 저장소 문서.
# Jekyll은 front matter 없는 파일을 정적 파일로 그대로 복사한다 — 2026-09-03 확인 시점에
# https://jeon-hs401.github.io/CLAUDE.md 와 /README.md 가 HTTP 200으로 열려 있었다.
#
# ★ 주의 — 이건 정리이지 차단이 아니다.
#   이 저장소는 PUBLIC이라 exclude해도 raw.githubusercontent.com으로 파일이 그대로 읽힌다.
#   공개되면 곤란한 내용은 애초에 이 저장소에 두지 않는다(CLAUDE.md 첫 줄).
exclude:
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# 게시글 layout 기본값
defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: "post" }
